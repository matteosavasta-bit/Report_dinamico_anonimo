  <text x="94" y="335" text-anchor="middle" fill="#666" font-size="8">file · hash · embed</text>

  <rect x="154" y="306" width="100" height="38" rx="8" fill="#FFFFFF" stroke="#82A8C6" stroke-width="0.8"/>
  <text x="204" y="322" text-anchor="middle" fill="#1A1A1A" font-size="10" font-weight="700">bom_items</text>
  <text x="204" y="335" text-anchor="middle" fill="#666" font-size="8">distinte · materiali</text>

  <rect x="264" y="306" width="100" height="38" rx="8" fill="#FFFFFF" stroke="#82A8C6" stroke-width="0.8"/>
  <text x="314" y="322" text-anchor="middle" fill="#1A1A1A" font-size="10" font-weight="700">quotes</text>
  <text x="314" y="335" text-anchor="middle" fill="#666" font-size="8">preventivi · esito</text>

  <rect x="374" y="306" width="100" height="38" rx="8" fill="#FFFFFF" stroke="#82A8C6" stroke-width="0.8"/>
  <text x="424" y="322" text-anchor="middle" fill="#1A1A1A" font-size="10" font-weight="700">jobs</text>
  <text x="424" y="335" text-anchor="middle" fill="#666" font-size="8">part program · tempi</text>

  <rect x="484" y="306" width="72" height="38" rx="8" fill="#FFFFFF" stroke="#82A8C6" stroke-width="0.8"/>
  <text x="520" y="321" text-anchor="middle" fill="#1A1A1A" font-size="9.5" font-weight="700">quote_</text>
  <text x="520" y="333" text-anchor="middle" fill="#1A1A1A" font-size="9.5" font-weight="700">order_link</text>

