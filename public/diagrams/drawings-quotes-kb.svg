    <rect x="380" y="0" width="12" height="12" rx="3" fill="#FFF8E0" stroke="#B8922E" stroke-width="0.8" stroke-dasharray="2,1"/>
    <text x="398" y="10" fill="#666" font-size="9">Fine-Tuning Track</text>
  </g>

  <text x="300" y="760" text-anchor="middle" fill="#888" font-size="9">Ingestion automatica: Email (IMAP) · CAD 3D per macchine (export) · sistema di gestione job (export) — zero impatto su produzione</text>

  <!-- Footer -->
  <text x="300" y="828" text-anchor="middle" fill="#AAAAAA" font-size="8.5">© 2026 Perspective AI — Drawings &amp; Quotes Knowledge Base, il cliente</text>
