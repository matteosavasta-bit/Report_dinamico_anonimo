  <text x="104" y="220" text-anchor="middle" fill="#4A4A4A" font-size="8.5">allegati + metadata</text>

  <rect x="174" y="192" width="124" height="36" rx="8" fill="#A3C4E0" stroke="#82A8C6" stroke-width="1"/>
  <text x="236" y="207" text-anchor="middle" fill="#1A1A1A" font-size="10" font-weight="700">CAD Extractor</text>
