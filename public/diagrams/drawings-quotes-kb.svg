  <rect x="50" y="648" width="210" height="56" rx="10" fill="#F7D96E" stroke="#DEC25A" stroke-width="1"/>
  <ellipse cx="84" cy="672" rx="12" ry="7" fill="none" stroke="#B8922E" stroke-width="1.2"/>
  <path d="M72,672 L72,684 Q84,691 96,684 L96,672" fill="none" stroke="#B8922E" stroke-width="1.2"/>
  <text x="162" y="672" text-anchor="middle" fill="#1A1A1A" font-size="12" font-weight="700">Sage X3</text>
  <text x="162" y="688" text-anchor="middle" fill="#666" font-size="9.5">SQL Server · Read-Only</text>

  <!-- KB il cliente (blue) -->
