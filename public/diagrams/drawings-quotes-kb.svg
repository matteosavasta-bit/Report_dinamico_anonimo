  <text x="300" y="552" text-anchor="middle" fill="#4A4A4A" font-size="9.5">Dataset 27K+ storici  →  (disegno + BOM) → (materie prime, tempi, prezzo, margine)</text>
  <text x="300" y="568" text-anchor="middle" fill="#876A1A" font-size="9.5" font-weight="600">Modello AI servito come assistente di preventivazione automatica</text>
  <rect x="250" y="574" width="100" height="12" rx="6" fill="none" stroke="#B8922E" stroke-width="0.8"/>
  <text x="300" y="583" text-anchor="middle" fill="#876A1A" font-size="7" font-weight="600">MEDIO TERMINE</text>

