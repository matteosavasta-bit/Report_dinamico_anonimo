  <rect x="217" y="448" width="166" height="40" rx="8" fill="#A3C4E0" stroke="#82A8C6" stroke-width="1"/>
  <text x="300" y="465" text-anchor="middle" fill="#1A1A1A" font-size="11" font-weight="700">Quote Retrieval</text>
  <text x="300" y="479" text-anchor="middle" fill="#4A4A4A" font-size="9">preventivo storico per analogia</text>

  <rect x="390" y="448" width="166" height="40" rx="8" fill="#A3C4E0" stroke="#82A8C6" stroke-width="1"/>
  <text x="473" y="465" text-anchor="middle" fill="#1A1A1A" font-size="11" font-weight="700">Commercial Export</text>
  <text x="473" y="479" text-anchor="middle" fill="#4A4A4A" font-size="9">accesso autonomo Commerciale</text>

  <!-- Connector down -->
  <line x1="300" y1="494" x2="300" y2="512" stroke="#D0D0D0" stroke-width="1" stroke-dasharray="4,3"/>

