  <ellipse cx="374" cy="672" rx="12" ry="7" fill="none" stroke="#5585A8" stroke-width="1.2"/>
  <path d="M362,672 L362,684 Q374,691 386,684 L386,672" fill="none" stroke="#5585A8" stroke-width="1.2"/>
  <text x="452" y="672" text-anchor="middle" fill="#1A1A1A" font-size="12" font-weight="700">KB il cliente</text>
  <text x="452" y="688" text-anchor="middle" fill="#666" font-size="9.5">Postgres + pgvector + Blob</text>

  <!-- ETL Sync arrows -->
  <line x1="266" y1="668" x2="334" y2="668" stroke="#999" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <line x1="334" y1="684" x2="266" y2="684" stroke="#999" stroke-width="1.5" marker-end="url(#arrowLeft)"/>
  <text x="300" y="660" text-anchor="middle" fill="#888" font-size="8.5" font-weight="600">ETL Sync</text>

  <!-- Legend -->
  <g transform="translate(50, 730)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#F7D96E" stroke="#DEC25A" stroke-width="0.8"/>
    <text x="18" y="10" fill="#666" font-size="9">Read-Only (Sage X3 / Sources)</text>
    <rect x="200" y="0" width="12" height="12" rx="3" fill="#A3C4E0" stroke="#82A8C6" stroke-width="0.8"/>
