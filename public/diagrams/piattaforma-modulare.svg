  <text x="161" y="377" text-anchor="middle" fill="#4A4A4A" font-size="9.5">Ottimizzazione taglio barre 1D,</text>
  <text x="161" y="390" text-anchor="middle" fill="#4A4A4A" font-size="9.5">riduzione sfridi e gestione magazzino</text>
  <rect x="38" y="400" width="60" height="14" rx="7" fill="none" stroke="#5585A8" stroke-width="0.8"/>
  <text x="68" y="410" text-anchor="middle" fill="#3A6585" font-size="7.5" font-weight="600">READ-WRITE</text>

  <!-- il cliente AI Assistant (READ-ONLY → yellow) -->
