  <rect x="316" y="200" width="60" height="14" rx="7" fill="none" stroke="#5585A8" stroke-width="0.8"/>
  <text x="346" y="210" text-anchor="middle" fill="#3A6585" font-size="7.5" font-weight="600">READ-WRITE</text>

