  <text x="439" y="359" text-anchor="middle" fill="#1A1A1A" font-size="12.5" font-weight="700">il cliente AI Assistant</text>
  <text x="439" y="377" text-anchor="middle" fill="#4A4A4A" font-size="9.5">Chatbot aziendale per interrogazione</text>
