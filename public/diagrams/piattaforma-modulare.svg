  <!-- DB icon -->
  <ellipse cx="84" cy="666" rx="12" ry="7" fill="none" stroke="#B8922E" stroke-width="1.2"/>
  <path d="M72,666 L72,678 Q84,685 96,678 L96,666" fill="none" stroke="#B8922E" stroke-width="1.2"/>
  <text x="162" y="666" text-anchor="middle" fill="#1A1A1A" font-size="12" font-weight="700">Sage X3</text>
  <text x="162" y="682" text-anchor="middle" fill="#666" font-size="9.5">SQL Server · Produzione</text>

  <!-- DB Analitico -->
  <rect x="340" y="642" width="210" height="56" rx="10" fill="#A3C4E0" stroke="#82A8C6" stroke-width="1"/>
  <!-- DB icon -->
  <ellipse cx="374" cy="666" rx="12" ry="7" fill="none" stroke="#5585A8" stroke-width="1.2"/>
  <path d="M362,666 L362,678 Q374,685 386,678 L386,666" fill="none" stroke="#5585A8" stroke-width="1.2"/>
  <text x="452" y="666" text-anchor="middle" fill="#1A1A1A" font-size="12" font-weight="700">DB Analitico</text>
  <text x="452" y="682" text-anchor="middle" fill="#666" font-size="9.5">Replica · Analytics</text>

  <!-- ETL Sync arrows -->
  <line x1="266" y1="662" x2="334" y2="662" stroke="#999" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <line x1="334" y1="678" x2="266" y2="678" stroke="#999" stroke-width="1.5" marker-end="url(#arrowLeft)"/>
  <text x="300" y="654" text-anchor="middle" fill="#888" font-size="8.5" font-weight="600">ETL Sync</text>

  <!-- Write-back API arrow -->
  <line x1="155" y1="706" x2="155" y2="740" stroke="#B8922E" stroke-width="1.5" marker-start="url(#arrowUp)"/>
  <text x="155" y="754" text-anchor="middle" fill="#876A1A" font-size="8.5" font-weight="600">Write-Back API</text>

  <!-- Read arrow -->
  <line x1="445" y1="706" x2="445" y2="740" stroke="#5585A8" stroke-width="1.5" marker-start="url(#arrowUp)"/>
  <text x="445" y="754" text-anchor="middle" fill="#3A6585" font-size="8.5" font-weight="600">Read (Analytics)</text>

  <!-- Footer -->
  <text x="300" y="828" text-anchor="middle" fill="#AAAAAA" font-size="8.5">© 2026 AI Squared — Architettura Piattaformal cliente</text>
