  <text x="439" y="277" text-anchor="middle" fill="#4A4A4A" font-size="9.5">Monitoraggio fornitori, scoring</text>
  <text x="439" y="290" text-anchor="middle" fill="#4A4A4A" font-size="9.5">automatico e alert via email</text>
  <rect x="316" y="300" width="60" height="14" rx="7" fill="none" stroke="#5585A8" stroke-width="0.8"/>
  <text x="346" y="310" text-anchor="middle" fill="#3A6585" font-size="7.5" font-weight="600">READ-WRITE</text>

