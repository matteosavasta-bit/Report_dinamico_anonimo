      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
    <marker id="arrowLeft" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#999"/>
    </marker>
    <marker id="arrowUp" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto">
      <path d="M0,8 L3,0 L6,8 Z" fill="#B8922E"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="850" fill="#FFFFFF"/>

  <!-- ==================== TITLE ==================== -->
  <text x="300" y="38" text-anchor="middle" fill="#1A1A1A" font-size="19" font-weight="700">Piattaforma Modulare AI/BI — il cliente</text>
  <line x1="60" y1="52" x2="540" y2="52" stroke="#E0E0E0" stroke-width="1"/>

