  <rect x="388" y="512" width="168" height="26" rx="8" fill="#FFFFFF" stroke="#D5D5D5" stroke-width="0.8"/>
  <text x="472" y="529" text-anchor="middle" fill="#333" font-size="10" font-weight="500">Security &amp; Auth</text>

  <!-- Row 2 -->
  <rect x="44" y="546" width="160" height="26" rx="8" fill="#FFFFFF" stroke="#D5D5D5" stroke-width="0.8"/>
  <text x="124" y="563" text-anchor="middle" fill="#333" font-size="10" font-weight="500">Integration Bus</text>

  <rect x="216" y="546" width="160" height="26" rx="8" fill="#FFFFFF" stroke="#D5D5D5" stroke-width="0.8"/>
  <text x="296" y="563" text-anchor="middle" fill="#333" font-size="10" font-weight="500">Email Engine</text>

  <rect x="388" y="546" width="168" height="26" rx="8" fill="#FFFFFF" stroke="#D5D5D5" stroke-width="0.8"/>
  <text x="472" y="563" text-anchor="middle" fill="#333" font-size="10" font-weight="500">Sage X3 Write-Back</text>

  <!-- Connector -->
