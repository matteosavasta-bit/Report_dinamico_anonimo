  <text x="124" y="529" text-anchor="middle" fill="#333" font-size="10" font-weight="500">Data Engine</text>

  <rect x="216" y="512" width="160" height="26" rx="8" fill="#FFFFFF" stroke="#D5D5D5" stroke-width="0.8"/>
